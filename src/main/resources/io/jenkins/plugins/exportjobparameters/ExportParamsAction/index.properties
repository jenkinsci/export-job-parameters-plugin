intro=\
  The parameters of this job as Pipeline code. Use the Declarative or the Scripted form, whichever your Jenkinsfile \
  is written in. The plugins that provide the parameter types must be installed where the Pipeline runs.
declarative.help=Paste this directive into the pipeline block of your Jenkinsfile.
declarative.unavailable=\
  At least one parameter type of this job has no Pipeline symbol, so it cannot be declared in a Declarative Pipeline. \
  Use the Scripted Pipeline syntax below instead.
scripted.help=\
  Paste this step at the top of your Jenkinsfile. If the Jenkinsfile already calls properties, add the parameters \
  to that call instead, because a second call replaces the first.
